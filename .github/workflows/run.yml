name: Execute script

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # Se ejecutará automáticamente cada 15 minutos

permissions:
  contents: read
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, openssl

      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-progress

      - name: Run OCI Instance Creator
        env:
          OCI_TENANCY_OCID: "${{ secrets.OCI_TENANCY_OCID }}"
          OCI_USER_OCID: "${{ secrets.OCI_USER_OCID }}"
          OCI_FINGERPRINT: "${{ secrets.OCI_FINGERPRINT }}"
          OCI_PRIVATE_KEY: "${{ secrets.OCI_PRIVATE_KEY }}"
          OCI_REGION: "${{ secrets.OCI_REGION }}"
          OCI_SUBNET_ID: "${{ secrets.OCI_SUBNET_ID }}"
          OCI_MAX_INSTANCES: "1"
          OCI_OCPUS: "4"
          OCI_MEMORY_IN_GBS: "24"
          OCI_SSH_PUBLIC_KEY: "${{ secrets.OCI_SSH_PUBLIC_KEY }}"
        run: php index.php
