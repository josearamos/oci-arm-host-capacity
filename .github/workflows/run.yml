name: Execute script

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *' # Se ejecuta automáticamente cada 15 minutos

jobs:
  run-script:
    runs-on: ubuntu-latest
    name: OCI Instance Creator (PHP 8.3)
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, mbstring, openssl

      - name: Install dependencies
        run: |
          composer install --no-dev --prefer-dist --no-progress

      - name: Run OCI Instance Creator
        run: |
          # Este comando mágico crea el archivo físico de la clave antes de arrancar PHP
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > oracle_key.pem
          php index.php
        env:
          # Mapeo de variables esenciales
          OCI_REGION: ${{ secrets.OCI_REGION }}
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_ID }}
          
          # Le pasamos la ruta absoluta del archivo que acabamos de crear arriba
          OCI_PRIVATE_KEY_FILENAME: './oracle_key.pem'
          
          # ID de la Imagen Obligatoria para Madrid (Ubuntu 22.04 ARM)
          OCI_IMAGE_ID: 'ocid1.image.oc1.eu-madrid-1.aaaaaaaamv3u6j6j6ywhgffg3u7v6b2s2o5v7z5vmdgxtw3g4vpaaaaa'
          
          # Configuraciones para la máquina Ampere
          OCI_MAX_INSTANCES: ${{ secrets.OCI_MAX_INSTANCES || '1' }}
          OCI_OCPUS: ${{ secrets.OCI_OCPUS || '4' }}
          OCI_MEMORY_IN_GBS: ${{ secrets.OCI_MEMORY_IN_GBS || '24' }}
          OCI_SSH_PUBLIC_KEY: ${{ secrets.OCI_SSH_PUBLIC_KEY }}
          
          # Notificaciones (Telegram / Discord)
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
